<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英検2級">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>英検2級トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Russo+One&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* 配置：スマホ1列のアプリ。上に固定の帯（レベルと連続日数）、下に5つのタブ。選択肢はマークシートの丸、作文欄は解答用紙の罫線 */
:root{
  --paper:#F4F6FB; --card:#FFFFFF; --ink:#16203A; --muted:#566180; --line:#DCE1EE; --soft:#EBF0FC;
  --accent:#2B57E6; --accent-ink:#FFFFFF; --mark:#FFE36E; --mark-ink:#16203A;
  --ok:#147A4B; --ok-bg:#E0F2E8; --ng:#C23A2F; --ng-bg:#FBE4E1; --warn-bg:#FFF5D1; --warn-ink:#5C4500;
  --f-en:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1220; --card:#151C2D; --ink:#E6EAF4; --muted:#9BA6C0; --line:#28324A; --soft:#1B2440;
    --accent:#7F9EFF; --accent-ink:#0D1220; --mark:#E5C440; --mark-ink:#16203A;
    --ok:#4CC88E; --ok-bg:#12301F; --ng:#FF8378; --ng-bg:#3A1916; --warn-bg:#3A3110; --warn-ink:#F3DC8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1220; --card:#151C2D; --ink:#E6EAF4; --muted:#9BA6C0; --line:#28324A; --soft:#1B2440;
  --accent:#7F9EFF; --accent-ink:#0D1220; --mark:#E5C440; --mark-ink:#16203A;
  --ok:#4CC88E; --ok-bg:#12301F; --ng:#FF8378; --ng-bg:#3A1916; --warn-bg:#3A3110; --warn-ink:#F3DC8A;
  color-scheme:dark;
}
/* WORDCRAFT と同じテーマの色（土・緑・バレー・ダーク・ライト。「自動」は端末に合わせる＝上の色）。設定で切り替え、html の data-skin に入る */
:root[data-skin="tsuchi"]{
  --paper:#3a2a1a; --card:#6b4f33; --ink:#f7f3e9; --muted:#ece2cd; --line:#281b0f; --soft:#7d5d3c;
  --accent:#6cc24a; --accent-ink:#13200b; --mark:#f0c419; --mark-ink:#2a1d0f; --link:#d6f7c0;
  --ok:#9be07a; --ok-bg:#2d3d1f; --ok-ink:#13200b; --ng:#ffb0a3; --ng-bg:#3a201d; --ng-ink:#2a0d08; --warn-bg:#3d3018; --warn-ink:#f0d48a;
  color-scheme:dark;
}
:root[data-skin="midori"]{
  --paper:#1c2e16; --card:#3f5e2c; --ink:#f1f8e8; --muted:#dcebca; --line:#16240f; --soft:#4d6e36;
  --accent:#8bd957; --accent-ink:#10200a; --mark:#f0c419; --mark-ink:#1c2e16; --link:#d6f7c0;
  --ok:#b4ec8a; --ok-bg:#23371a; --ok-ink:#10200a; --ng:#ffb0a3; --ng-bg:#3a201d; --ng-ink:#2a0d08; --warn-bg:#3a3a18; --warn-ink:#f0e08a;
  color-scheme:dark;
}
:root[data-skin="volley"]{
  --paper:#0d0f15; --card:#171b24; --ink:#f3f5fa; --muted:#9aa3b8; --line:#2a3142; --soft:#1f2532;
  --accent:#ff6a1a; --accent-ink:#1b0d04; --mark:#ffc23d; --mark-ink:#1b0d04; --link:#ff8a3d;
  --ok:#2fd07a; --ok-bg:#13301f; --ok-ink:#0b1a10; --ng:#ff5b4d; --ng-bg:#34201d; --ng-ink:#1f0a08; --warn-bg:#33290f; --warn-ink:#ffc23d;
  color-scheme:dark;
}
:root[data-skin="dark"]{
  --paper:#0e1320; --card:#19202f; --ink:#e9ecf5; --muted:#98a2ba; --line:#2b3450; --soft:#212a3c;
  --accent:#5aa0ff; --accent-ink:#0e1320; --mark:#ffce4d; --mark-ink:#16203A; --link:#7cb4ff;
  --ok:#34d27b; --ok-bg:#16321f; --ok-ink:#0b1a10; --ng:#ff6b5e; --ng-bg:#39201d; --ng-ink:#1f0a08; --warn-bg:#2f2a14; --warn-ink:#ffce4d;
  color-scheme:dark;
}
:root[data-skin="light"]{
  --paper:#eef1f8; --card:#ffffff; --ink:#1f2430; --muted:#5b6273; --line:#e4e7f0; --soft:#f4f6fb;
  --accent:#c2480e; --accent-ink:#ffffff; --mark:#FFE36E; --mark-ink:#16203A; --link:#1f6feb;
  --ok:#15803d; --ok-bg:#e9f7ee; --ok-ink:#ffffff; --ng:#c8281c; --ng-bg:#fdeceb; --ng-ink:#ffffff; --warn-bg:#fdf4dd; --warn-ink:#5C4500;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ja);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link,var(--accent))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h2:focus{outline:none}
.en{font-family:var(--f-read);font-size:1.06rem}
.small{font-size:.86rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in,.wrap,.tabs-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-family:var(--f-en);font-weight:700;font-size:1.02rem;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--f-en);font-size:.8rem}
.lv{font-weight:700}
.xpbar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.streak{white-space:nowrap;color:var(--muted)}
.streak b{color:var(--ink)}

.wrap{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:16px}
#view>h2,.qt{font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:0 0 8px}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:min(92vw,520px);background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}

/* ホーム */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.count{display:flex;align-items:baseline;gap:6px;font-family:var(--f-en);line-height:1}
.count .num{font-size:3.6rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.count .unit{font-size:1.1rem;font-weight:600}
.hero .date{font-size:.9rem}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.sub div{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.sub span{font-size:.76rem;color:var(--muted)}
.sub b{font-family:var(--f-en);font-size:1.1rem;font-variant-numeric:tabular-nums}
.sub small{font-size:.76rem;color:var(--muted)}
.hero .note{font-size:.78rem;color:var(--muted);margin-top:4px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.task .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.task.done .tick{background:var(--ok);border-color:var(--ok)}
.task.done .tick::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task .tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.task small{color:var(--muted);font-size:.8rem}
.task .min{font-family:var(--f-en);font-size:.8rem;color:var(--muted);white-space:nowrap}
.task.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:.74rem;color:var(--muted)}
.stat b{font-family:var(--f-en);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat small{font-size:.7rem;color:var(--muted);line-height:1.35}
.linkrow{display:flex;flex-direction:column;gap:8px}
.linkrow a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.linkrow a small{color:var(--muted)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open]>summary::after{content:"－"}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;color:var(--muted)}
input[type=date],select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.confirm{background:var(--ng-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* メニューのカード */
.menu{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.mi .mt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.mi small{color:var(--muted);font-size:.82rem}
.mi .go{font-family:var(--f-en);color:var(--accent);font-weight:700}
.mi .badge{font-family:var(--f-en);font-size:.75rem;background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.sec{font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin:4px 2px -4px}

/* 問題 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:none;border:none;color:var(--accent);font-weight:700;padding:8px 4px;min-height:44px}
.prog{font-family:var(--f-en);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progline{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progline i{display:block;height:100%;background:var(--accent)}
.prompt{display:flex;flex-direction:column;gap:8px}
.q{font-size:1.14rem;line-height:1.75}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;margin:0 .15em}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bubble{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-en);font-size:.8rem;font-weight:600}
.choice .ct{flex:1;min-width:0}
.choice.picked .bubble{background:var(--ink);border-color:var(--ink);color:var(--card)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .bubble{background:var(--ok);border-color:var(--ok);color:var(--ok-ink,#fff)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg)}
.choice.wrong .bubble{background:var(--ng);border-color:var(--ng);color:var(--ng-ink,#fff)}
.choice:disabled{cursor:default;opacity:1}
.fb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--card)}
.verdict{font-weight:700;font-size:1.05rem}
.fb.ok .verdict{color:var(--ok)}
.fb.ng .verdict{color:var(--ng)}
.expl{display:flex;flex-direction:column;gap:6px}
.meanings{font-size:.86rem;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.script{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.script p{font-family:var(--f-read)}
.script .sp{font-family:var(--f-en);font-weight:700;font-size:.8rem;color:var(--muted);margin-right:6px}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:12px}
.player .play{flex:1 1 200px}
.speed{display:flex;gap:6px}
.speed button{min-height:40px;min-width:48px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--f-en);font-size:.82rem}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.result{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.result .big{font-family:var(--f-en);font-size:2.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.wlist li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}

/* カード */
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;min-height:240px;justify-content:center}
.flash .term{font-family:var(--f-en);font-size:1.7rem;font-weight:600;line-height:1.3}
.flash .mean{font-size:1.15rem;font-weight:700}
.flash .ex{font-family:var(--f-read);font-size:1.05rem}
.flash .exja{font-size:.88rem;color:var(--muted)}
.boxes{display:flex;gap:4px;justify-content:center}
.boxes i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tcell{border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--card);font-family:var(--f-en);font-size:.74rem;line-height:1.35;display:flex;flex-direction:column;align-items:center}
.tcell b{font-family:var(--f-ja);font-size:.76rem;font-weight:600}
.tcell[data-s="1"]{background:var(--soft)}
.tcell[data-s="2"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tcell[data-s="3"]{background:var(--ok);color:var(--ok-ink,#fff);border-color:var(--ok)}
/* WORDCRAFT から引き継いだ部品：ランク表・設定の切り替えボタン・マイク */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-size:.9rem;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.rankrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:0}
.rankrow .ic{font-size:1.4rem;width:2rem;text-align:center}
.rankrow .nm{flex:1;font-weight:600}
.rankrow .pt{font-size:.82rem;color:var(--muted);font-family:var(--f-en)}
.rankrow.cur{background:var(--soft);border-radius:10px;padding-inline:8px}
.rankrow.cur .nm::after{content:"　いまここ";font-size:.78rem;color:var(--accent);font-weight:700}
.mic{font-size:1.05rem}
.mic.live{background:var(--ng);border-color:var(--ng);color:var(--ng-ink,#fff)}
.micres{font-size:.92rem}
.micres .heard{color:var(--muted);font-size:.86rem}
.miss{background:var(--ng-bg);color:var(--ng);border-radius:4px;padding:0 2px}
input[type=range]{accent-color:var(--accent);width:min(220px,60vw)}

/* ディクテーション */
.diff{font-family:var(--f-read);font-size:1.08rem;line-height:1.9}
.diff .hit{color:var(--ok)}
.diff .miss{color:var(--ng);text-decoration:underline;text-decoration-thickness:2px;font-weight:600}
.diff .extra{color:var(--muted);text-decoration:line-through}

/* 作文 */
.taskbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lbl{font-family:var(--f-en);font-size:.74rem;letter-spacing:.12em;color:var(--muted);font-weight:600}
.topic{font-size:1.1rem}
.points{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.points li{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.95rem}
.points li small{font-family:var(--f-ja);color:var(--muted);font-size:.75rem;margin-left:4px}
.passage{line-height:1.75}
textarea.lined{font-family:var(--f-read);font-size:1.05rem;line-height:2.1em;padding:0 12px;min-height:calc(2.1em * 9);resize:vertical;
  background-color:var(--card);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.1em - 1px),var(--line) calc(2.1em - 1px),var(--line) 2.1em);background-attachment:local}
.counter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem}
.counter b{font-family:var(--f-en);font-size:1.5rem;font-variant-numeric:tabular-nums}
.chip{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.chip.in{background:var(--ok-bg);color:var(--ok)}
.chip.out{background:var(--ng-bg);color:var(--ng)}
.chip.zero{background:var(--soft);color:var(--muted)}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.checks input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.checks .kan{font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-right:4px;white-space:nowrap}
.model{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.seg .tag{font-size:.72rem;font-weight:700;background:var(--soft);border-radius:6px;padding:2px 6px;white-space:nowrap;margin-top:3px}
.seg .ja{grid-column:2;font-size:.82rem;color:var(--muted)}
.timer{font-family:var(--f-en);font-variant-numeric:tabular-nums;font-weight:700}
.ai{display:flex;flex-direction:column;gap:8px}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
function addDays(s, n){ const p = s.split("-").map(Number); return ymd(new Date(p[0], p[1] - 1, p[2] + n)); }
function daysUntil(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return null; const p = s.split("-").map(Number); const a = new Date(); a.setHours(0,0,0,0); return Math.round((new Date(p[0], p[1] - 1, p[2]) - a) / 86400000); }
function fmtDate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return "未設定"; const p = s.split("-").map(Number); const w = "日月火水木金土"[new Date(p[0], p[1] - 1, p[2]).getDay()]; return p[0] + "年" + p[1] + "月" + p[2] + "日（" + w + "）"; }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function countWords(s){ const m = String(s).match(/[A-Za-z0-9][A-Za-z0-9'’\-]*/g); return m ? m.length : 0; }
function sentences(t){ return (t.match(/[^.!?]+[.!?]+["”]?/g) || [t]).map(x => x.trim()).filter(Boolean); }

const KEY = "eiken2-trainer-v1";
// 声・速さ・高さ・アクセント・効果音・テーマは WORDCRAFT と同じ既定（速さ 0.85・高さ 1・米・音あり・土）
const SKINS = [["tactical","タクティカル"],["tsuchi","土"],["midori","緑"],["volley","バレー"],["dark","ダーク"],["light","ライト"],["auto","自動"]];
const DEF = {v:1, xp:0, days:{}, stats:{}, items:{}, wrong:{}, cards:{}, drafts:{}, done:{}, target:[], g:{}, passtan:{}, settings:{rate:0.85, voice:"", accent:"en-US", pitch:1, sound:true, skin:"auto", dates:{apply:"2026-12-14", first:"2027-01-24", second:"2027-03-07"}}};
function clampRate(r){ r = parseFloat(r) || 0.85; return Math.max(0.5, Math.min(1.2, r)); }
let canSave = true;
function fresh(){ return JSON.parse(JSON.stringify(DEF)); }
function merge(o){
  const d = fresh();
  if(!o || typeof o !== "object") return d;
  Object.keys(d).forEach(k => {
    if(o[k] === undefined) return;
    if(k === "settings"){
      const os = o.settings || {};
      d.settings.rate = typeof os.rate === "number" ? clampRate(os.rate) : 0.85;
      d.settings.voice = typeof os.voice === "string" ? os.voice : "";
      d.settings.accent = os.accent === "en-GB" ? "en-GB" : "en-US";
      d.settings.pitch = typeof os.pitch === "number" && os.pitch >= 0.5 && os.pitch <= 2 ? os.pitch : 1;
      d.settings.sound = typeof os.sound === "boolean" ? os.sound : true;
      d.settings.skin = SKINS.some(s => s[0] === os.skin) ? os.skin : "tactical";
      d.settings.dates = Object.assign(d.settings.dates, os.dates || {});
    } else d[k] = o[k];
  });
  return d;
}
function load(){
  let raw = null;
  try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); raw = localStorage.getItem(KEY); }
  catch(e){ canSave = false; }
  if(!raw) return fresh();
  try { return merge(JSON.parse(raw)); } catch(e){ return fresh(); }
}
const S = load();
function save(){
  if(!canSave) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ canSave = false; $("#banner").hidden = false; }
}
function day(){ const t = today(); if(!S.days[t]) S.days[t] = {n:0, c:0, xp:0, tasks:{}}; return S.days[t]; }
// ランク（WORDCRAFT と同じ点の区切り。名前はバレーボールにちなむ）
const RANKS = [{p:0,nm:"ボール拾い",ic:"🏐"},{p:120,nm:"声出し",ic:"📣"},{p:350,nm:"ベンチ入り",ic:"🪑"},{p:700,nm:"ピンチサーバー",ic:"🎯"},{p:1200,nm:"レギュラー",ic:"👟"},{p:2000,nm:"エース",ic:"🔥"},{p:3200,nm:"キャプテン",ic:"🎖️"},{p:5000,nm:"都大会",ic:"🏟️"},{p:7500,nm:"関東大会",ic:"🗾"},{p:11000,nm:"全国大会",ic:"🏆"},{p:16000,nm:"日本代表",ic:"🇯🇵"}];
function rankOf(x){ let idx = 0; RANKS.forEach((r, i) => { if(x >= r.p) idx = i; }); return {idx, r:RANKS[idx], next:RANKS[idx + 1] || null}; }
function addXP(n){
  const before = rankOf(S.xp).idx;
  const x0 = S.xp;
  S.xp += n; day().xp += n;
  const after = rankOf(S.xp);

function itemById(id){

  const items = pickIdx(VOCAB.length, "v", nv).map(vocabItem).concat(pickIdx(IDIOMS.length, "ib", ni).map(idiomBlankItem));
  return shuffle(items);
}

/* ===== 問題を解く画面（共通） ===== */
function runQuiz(cfg){
  // cfg: {title, items, mode:'exam'|'practice'|'normal', back, task}
  let i = 0, score = 0; const wrong = []; const xp0 = S.xp;
  const n = cfg.items.length;
  function show(){
    if(i >= n) return finish();
    const it = cfg.items[i]; let played = 0;
    const audioBox = it.audio ? (TTS.ok
      ? '<div class="player"><button class="btn primary play" data-act="play">▶ 放送を聞く</button>' + (cfg.mode === "practice" ? speedHtml() : "") + "</div>" + (cfg.mode === "exam" ? '<p class="small">本番と同じく放送は1回だけ。選択肢は先に読んでおけます。</p>' : "")
      : '<p class="banner">この画面では英語の読み上げが使えないため、英文を表示します。</p>' + it.fallback) : "";
    view('<div class="bar"><button class="back" data-act="back">← やめる</button><span class="prog">' + (i + 1) + " / " + n + '</span></div>' +
      '<div class="progline"><i style="width:' + (i / n * 100) + '%"></i></div>' +
      '<h2 class="qt">' + esc(cfg.title) + "</h2>" + audioBox +
      '<div class="prompt">' + it.prompt + (it.speak && TTS.ok ? '<p><button class="btn" data-act="say">発音を聞く</button></p>' : "") + "</div>" +
      '<div class="choices" role="group" aria-label="選択肢">' + it.choices.map((c, k) => '<button class="choice" data-act="pick" data-k="' + k + '"><span class="bubble">' + (k + 1) + '</span><span class="ct' + (it.jaChoices ? "" : " en") + '">' + esc(c) + "</span></button>").join("") + "</div>" +
      '<div id="fb" hidden></div>', {
      back: cfg.back,
      play: el => {
        if(cfg.mode === "exam" && played) return;
        played++; el.disabled = true; el.textContent = "再生中…";
        TTS.play(it.audio, ok => {
          if(!ok){
            el.textContent = TTS.reason === "noen" ? "英語の声がありません" : "声が出ませんでした";
            const fbk = document.createElement("div");
            fbk.className = "expl";
            fbk.innerHTML = '<p class="banner">' + esc(TTS.whyText()) + "今回は英文を読んで解けます。</p>" + it.fallback;
            el.parentNode.insertAdjacentElement("afterend", fbk);
            return;
          }
          if(cfg.mode === "exam"){ el.textContent = "放送は終わりました"; }
          else { el.disabled = false; el.textContent = "▶ もう一度聞く"; }
        });
      },
      speed: el => { S.settings.rate = +el.dataset.r; save(); $$(".speed button").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false")); },
      say: () => TTS.play([{role:"N", text:it.speak}]),
      pick: el => {
        const fb = $("#fb"); if(!fb.hidden) return;
        const k = +el.dataset.k, ok = k === it.ans;
        $$(".choice").forEach((b, j) => { b.disabled = true; if(j === it.ans) b.classList.add("right"); else if(j === k) b.classList.add("wrong"); });
        el.classList.add("picked");
        record(it.area, it.id, ok);
        if(ok) score++; else wrong.push(it);
        fb.className = "fb " + (ok ? "ok" : "ng");
        if(ok){ sfxPoint(); burst(); } else sfxMiss();
        fb.innerHTML = '<p class="verdict" tabindex="-1">' + (ok ? "正解！" : "ざんねん") + "　答えは " + (it.ans + 1) + "</p>" +
          '<div class="expl">' + it.explain + "</div>" +
          '<button class="btn primary wide" data-act="next">' + (i + 1 < n ? "次へ" : "結果を見る") + "</button>";
        fb.hidden = false;
        try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e){ fb.scrollIntoView(); }
      },
      next: () => { i++; show(); }
    }, false);
  }
  function finish(){
    if(cfg.task) markTask(cfg.task);
    const gained = S.xp - xp0;
    view('<div class="bar"><button class="back" data-act="back">← 戻る</button><span class="prog">結果</span></div>' +
      '<h2 class="qt">' + esc(cfg.title) + "</h2>" +
      '<section class="card result"><span class="small">正解</span><span class="big">' + score + " / " + n + '</span><span class="small">正答率 ' + Math.round(score / n * 100) + "%</span></section>" +
      (wrong.length ? '<section class="card"><h3>間違えた問題（' + wrong.length + '）</h3><ul class="wlist">' + wrong.map(w => '<li><span class="en">' + esc(w.short) + '</span><br><b>答え：</b><span class="' + (w.jaChoices ? "" : "en") + '">' + esc(w.choices[w.ans]) + "</span></li>").join("") + "</ul></section>" : '<section class="card"><p>全問正解。次はもっと速く解けるか試そう。</p></section>') +
      '<div class="row">' + (wrong.length ? '<button class="btn primary" data-act="retry">間違えた問題をもう一度</button>' : "") + '<button class="btn" data-act="back">戻る</button></div>', {
      back: cfg.back,
      retry: () => runQuiz({title:cfg.title + "（やり直し）", items:wrong.map(w => itemById(w.id) || w), mode:cfg.mode, back:cfg.back})
    });
  }
  show();
}
function speedHtml(){
  const r = clampRate(S.settings.rate);
  return '<div class="speed" role="group" aria-label="速さ">' + [0.75, 0.85, 1, 1.1].map(x => '<button data-act="speed" data-r="' + x + '" aria-pressed="' + (Math.abs(r - x) < 0.01) + '">' + (x === 1 ? "1.0" : x) + "×</button>").join("") + "</div>";
}

function startTask(k){
  const back = () => goTab("home");
  if(k === "listen") return runQuiz({title:"今日のリスニング", items:shuffle(pickIdx(L1.length, "p1-", 3).map(l1Item).concat(pickIdx(L2.length, "p2-", 2).map(l2Item))), mode:"exam", back:back, task:"listen"});
  if(k === "cards") return runCards(back, "cards");
  if(k === "mock17") return runQuiz({title:"大問1の模擬（17問）", items:mock(17), mode:"normal", back:back, task:"mock17"});
  if(k === "opinion"){ const t = OPINION.find(o => !S.done[o.id]) || OPINION[Math.floor(Math.random() * OPINION.length)]; return openWriting("op", OPINION.indexOf(t), back); }
  if(k === "summary"){ const t = SUMMARY.find(o => !S.done[o.id]) || SUMMARY[Math.floor(Math.random() * SUMMARY.length)]; return openWriting("su", SUMMARY.indexOf(t), back); }
  if(k === "speak"){ const t = CARDS.find(o => !S.done[o.id]) || CARDS[Math.floor(Math.random() * CARDS.length)]; return runInterview(CARDS.indexOf(t), back); }

function statCell(area, label, min){
  const st = S.stats[area] || {n:0, c:0};
  let sub;
  if(min && st.n >= min) sub = "正答率 " + Math.round(st.c / st.n * 100) + "%";
  else if(min) sub = st.n ? "あと" + (min - st.n) + "問で正答率" : "まだ";
  else sub = st.n ? "回やった" : "まだ";
  return '<div class="stat"><span>' + label + "</span><b>" + st.n + "</b><small>" + sub + "</small></div>";
}

// 音読の判定：本文の語のうち、聞き取れた語を順番どおりに数える（LCS）
function wordMatch(target, heard){
  const T = String(target).split(/\s+/).filter(Boolean), tn = T.map(w => Mic.norm(w));
  const H = String(heard).split(/\s+/).map(w => Mic.norm(w)).filter(Boolean);
  const m = tn.length, n = H.length, dp = Array.from({length:m + 1}, () => new Array(n + 1).fill(0));
  for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--) dp[i][j] = tn[i] && tn[i] === H[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(m).fill(false); let i = 0, j = 0;
  while(i < m && j < n){ if(tn[i] && tn[i] === H[j]){ hit[i] = true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return {T, hit, total: tn.filter(Boolean).length, got: hit.filter((h, k) => h && tn[k]).length, tn};
}

const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function dueCards(limit){
  const t = today(); const due = [], fresh_ = [];
  IDIOMS.forEach((x, i) => { const c = S.cards[i]; if(!c) fresh_.push(i); else if(c.due <= t) due.push(i); });
  due.sort((a, b) => (S.cards[a].due < S.cards[b].due ? -1 : 1));
  return due.concat(fresh_).slice(0, limit);
}

function dictPool(){
  const out = [];
  L1.forEach(L => L.lines.forEach(l => out.push(l[1])));
  L2.forEach(L => sentences(L.text).forEach(s => out.push(s)));
  return out.filter(s => { const w = countWords(s); return w >= 6 && w <= 16 && !/\d/.test(s); });
}
function norm(s){ return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean); }
function lcsDiff(a, b){
  const n = a.length, m = b.length; const dp = [];
  for(let i = 0; i <= n; i++){ dp.push(new Array(m + 1).fill(0)); }
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ out.push(["hit", a[i]]); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push(["miss", a[i]]); i++; }
    else { out.push(["extra", b[j]]); j++; }
  }
  while(i < n) out.push(["miss", a[i++]]);
  while(j < m) out.push(["extra", b[j++]]);
  return {ops:out, hit:dp[0][0]};
}

function runInterview(idx, back){
  const C = CARDS[idx]; let step = 0; const N = 7;

  const ansBtn = (a) => '<button class="btn" data-act="ans">答えの例を見る</button><p class="en hide" id="ansBox">' + esc(a) + "</p>";
  const countdown = (sec, onEnd) => { let left = sec; $("#cd").textContent = left; every(() => { left--; const el = $("#cd"); if(!el) return; el.textContent = Math.max(left, 0); if(left === 0){ timers.forEach(clearInterval); timers = []; if(onEnd) onEnd(); } }, 1000); };
  function frame(title, body, extra){
    view('<div class="bar"><button class="back" data-act="back">← やめる</button><span class="prog">' + (step + 1) + " / " + N + "</span></div>" +
      '<div class="stepper">' + Array.from({length:N}, (x, k) => '<i class="' + (k <= step ? "on" : "") + '"></i>').join("") + "</div>" +
      '<h2 class="qt">' + title + "</h2>" + body +
      '<div class="row"><button class="btn primary wide" data-act="next">' + (step + 1 < N ? "次へ" : "おわる") + "</button></div>", Object.assign({
      back: () => { Mic.stop(); back(); },
      next: () => { Mic.stop(); step++; show(); },
      ans: () => { const a = $("#ansBox"); a.classList.toggle("hide"); },
      replay: () => say(extra && extra.q ? extra.q : "")
    }, extra && extra.h || {}));
  }

        '<div class="row">' + (TTS.ok ? '<button class="btn" data-act="model">お手本を聞く</button>' : "") + '<button class="btn mic" data-act="mic">🎙️ 音読を判定</button></div><div class="micres" id="micRes" aria-live="polite"></div>',
        {h:{
          model: () => say(full),
          mic: el => {
            if(Mic.live){ Mic.stop(); return; }
            el.classList.add("live"); el.textContent = "■ 読み終わったら押す"; $("#micRes").textContent = "🎙️ 聞いています…タイトルから読んでください。";
            Mic.listen(r => {
              el.classList.remove("live"); el.textContent = "🎙️ もう一度判定"; const box = $("#micRes"); if(!box) return;
              if(r.error){ box.textContent = Mic.errText(r.error); return; }
              const w = wordMatch(full, r.alts[0] || ""), pct = w.total ? Math.round(w.got / w.total * 100) : 0;

                '<p class="en passage">' + w.T.map((t, k) => w.tn[k] && !w.hit[k] ? '<span class="miss">' + esc(t) + "</span>" : esc(t)).join(" ") + "</p>";

      frame("No.2　3コマの説明", ex(q) + '<p class="big-timer" id="cd">20</p><div class="row"><button class="btn" data-act="go">考える時間 20秒</button></div>' + '<p class="lbl">言い出しの文（カードに印刷）</p><p class="startline">' + esc(C.start) + "</p>" + cardHtml(true) + '<p class="small">（本番は絵。ここでは場面を文で示しています）</p>' + ansBtn(C.a2), {q:q, h:{go: el => { el.disabled = true; countdown(20, () => { $("#cd").textContent = "話して！"; say("Please begin."); }); }}});
      say(q);
    } else if(step === 4){

      frame("No.3　あなたの意見（1）", ex(q) + '<p class="small">カードは裏返したので見ない。I agree. / I disagree. のあとに理由を2文。</p>' + (TTS.ok ? '<div class="row"><button class="btn" data-act="replay">質問をもう一度</button></div>' : "") + ansBtn(C.a3), {q:q});

    } else if(step === 5){

      frame("おつかれさま", '<section class="card"><h3>自分で見直す</h3><ul class="checks">' + ["面接委員の目を見て、聞こえる声で話せた","黙り込まずに何か言えた（Well, let me see. でつなぐ）","No.2 で3コマ全部と、コマの間の言葉を入れた","No.3・No.4 で理由を2つ言えた"].map((t, k) => '<li><label><input type="checkbox" id="sk' + k + '"><span>' + esc(t) + "</span></label></li>").join("") + "</ul></section>", {});
    } else {
      S.done[C.id] = {date:today()}; record("speak", null, true, 40); markTask("speak");
      back();
    }
  }
  show();
}

function G(){
  if(!S.g || typeof S.g !== "object" || Array.isArray(S.g)) S.g = {};
  const g = S.g, d = {coins:0, owned:{}, eq:{}, ch:{}, wins:0, best:0, battles:0};

  if(!g.v5){ g.v5 = 1; if(S.settings.skin === "tsuchi") S.settings.skin = "tactical"; }
  if(!g.started){ g.started = 1; g.coins = (g.coins || 0) + (S.xp || 0); g.owned = g.owned || {}; Object.keys(PASS).forEach(t => { if(+t <= tierOf(S.xp || 0)) g.owned[PASS[t]] = 1; }); }
  Object.keys(d).forEach(k => { if(g[k] == null || typeof g[k] !== typeof d[k]) g[k] = d[k]; });
  ITEMS.filter(x => x.free).forEach(x => { g.owned[x.id] = 1; });
  [["av","av0"],["title","t0"],["fx","fx0"],["banner","b0"]].forEach(p => { const it = itemOf(g.eq[p[0]]); if(!it || it.k !== p[0] || !g.owned[it.id]) g.eq[p[0]] = p[1]; });
  return g;
}

/* --- シーズンパス（シーズン1＝一次試験まで。200XP ごとに Tier が上がる） --- */
const TIER_XP = 200, TIERS = 50;
const PASS = {5:"t8", 10:"av16", 15:"fx6", 20:"av14", 25:"b5", 30:"t9", 35:"av15", 40:"t7"};
function tierOf(x){ return Math.min(TIERS, Math.floor(x / TIER_XP) + 1); }
function tierReward(t){ return PASS[t] ? {item:PASS[t]} : {coin: t % 10 === 0 ? 500 : (t % 2 ? 50 : 80)}; }
function rewardLabel(r){ if(r.item){ const it = itemOf(r.item); return it.ic + " " + it.nm; } return "🪙" + r.coin; }
// シンプル版（本人 2026/11/8「シンプルで ゲーム性なしでいい」）：ゲームの仕組みは動かさず、お知らせも出さない
const SIMPLE = true;
function gameXP(before, after){
  if(SIMPLE) return;
  const g = G(); g.coins += Math.max(0, after - before);
  for(let t = tierOf(before) + 1; t <= tierOf(after); t++){
    const r = tierReward(t); let msg = "🎟️ シーズンパス Tier " + t + "！ ";
    if(r.item && !g.owned[r.item]){ g.owned[r.item] = 1; const it = itemOf(r.item); msg += it.ic + " " + it.nm + "（" + RAR[it.r][0] + "）を手に入れた"; }
    else { const c = r.coin || 300; g.coins += c; msg += "🪙" + c; }
    notify(msg);
  }
}
function nextRewardText(t){
  for(let k = t + 1; k <= TIERS; k++){ const r = tierReward(k); if(r.item) return "次の限定アイテム：Tier " + k + " " + rewardLabel(r); }
  return "シーズンの報酬はすべて手に入れた";
}

const CH_D = [

  {id:"d7", t:"発音チャレンジで3回合格", ev:"mic", n:3}, {id:"d8", t:"今日のメニューを2つ終える", ev:"task", n:2},
  {id:"d9", t:"連語クイズで8問正解", ev:"answer", area:"colloc", ok:1, n:8}, {id:"d10", t:"長文で3問正解", ev:"answer", area:"read", ok:1, n:3}
];
const CH_W = [
  {id:"w8", t:"ラウンド戦で2勝する", ev:"match", win:1, n:2},
  {id:"w1", t:"サバイバルで1位を取る", ev:"battle", top:1, n:1}, {id:"w2", t:"問題に150問答える", ev:"answer", n:150},
  {id:"w3", t:"作文を1本仕上げる", ev:"task", key:/^(opinion|summary)$/, n:1}, {id:"w4", t:"面接を1回通す", ev:"task", key:/^speak$/, n:1},
  {id:"w5", t:"サバイバルで合計100人撃破", ev:"elim", n:100}, {id:"w6", t:"リスニングで30問正解", ev:"answer", area:"listen", ok:1, n:30},
  {id:"w7", t:"長文で12問正解", ev:"answer", area:"read", ok:1, n:12}
];
const CH_R = {d:{xp:30, coin:60}, w:{xp:120, coin:250}};
function seeded(str){ let h = 1779033703 ^ str.length; for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function pickSeeded(arr, n, key){ const r = seeded(key); return arr.map(x => [x, r()]).sort((a, b) => a[1] - b[1]).slice(0, n).map(x => x[0]); }
function weekKey(){ const t = today(), p = t.split("-").map(Number); const dow = (new Date(p[0], p[1] - 1, p[2]).getDay() + 6) % 7; return addDays(t, -dow); }
const chDef = id => CH_D.concat(CH_W).find(c => c.id === id);
function challenges(){
  const g = G(), t = today(), w = weekKey();
  if(g.ch.d !== t){ g.ch.d = t; g.ch.dl = pickSeeded(CH_D, 3, "d" + t).map(c => ({id:c.id, p:0, got:0})); }
  if(g.ch.w !== w){ g.ch.w = w; g.ch.wl = pickSeeded(CH_W, 4, "w" + w).map(c => ({id:c.id, p:0, got:0})); }
  return {d:g.ch.dl, w:g.ch.wl};
}
function gameEvent(ev, a){
  if(SIMPLE) return;
  const c = challenges(), done = [];
  [c.d, c.w].forEach(list => list.forEach(x => {
    const d = chDef(x.id); if(!d || d.ev !== ev || x.p >= d.n) return;
    let inc = 0;
    if(ev === "answer"){ if((!d.area || d.area === a.area) && (!d.ok || a.ok)) inc = 1; }
    else if(ev === "battle"){ if(!d.top || a.place <= d.top) inc = 1; }
    else if(ev === "match"){ if(!d.win || a.win) inc = 1; }
    else if(ev === "task"){ if(!d.key || d.key.test(a)) inc = 1; }
    else if(ev === "elim"){ inc = a; }
    else inc = 1;
    if(inc){ x.p = Math.min(d.n, x.p + inc); if(x.p >= d.n) done.push(d.t); }
  }));
  if(done.length){ notify("✅ チャレンジ達成：" + done.join("・") + "（ロビーで受け取れます）"); sfxWhistle(); }
  save();
}

/* --- ターゲット1900 連動（WORDCRAFT と同じ場所に置いた時だけ。WORDCRAFT のデータと記録を読むだけで、書き換えない・このファイルに単語は入れない） --- */
const T19 = {
  ready:false, words:[], prog:{}, state:"off",
  init(){
    try { this.prog = JSON.parse(localStorage.getItem("target1900_v2_prog") || "{}") || {}; } catch(e){ this.prog = {}; }
    if(!/(^|\.)genmaojun\.github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;
    this.state = "loading";
    // 読めても読めなくても、最後に必ずカードを書き直す（読めない時に「読み込み中…」のまま残さない）
    const redraw = () => { const n = $("#t19card"); if(n) n.outerHTML = t19Card(); };
    // WORDCRAFT（/tango1900/）の単語：まず words_1900.json、無ければ index.html の中の WORDS を読む（別のリポジトリに置いても同じ場所から読める）
    const take = a => { this.words = (Array.isArray(a) ? a : []).filter(w => w && w.no && w.en && w.ja); this.ready = this.words.length > 100; return this.ready; };
    fetch("/tango1900/words_1900.json").then(r => r.ok ? r.json() : null).then(take).catch(() => false)
      .then(ok => ok || fetch("/tango1900/index.html").then(r => r.ok ? r.text() : "").then(t => { const m = t.match(/const WORDS\s*=\s*(\[[\s\S]*?\]);\s*\n/); return m ? take(JSON.parse(m[1])) : false; }))
      .catch(() => false).then(() => { this.state = this.ready ? "on" : "nodata"; redraw(); });
  },
  stat(){ let known = 0, weak = 0, learn = 0; Object.keys(this.prog).forEach(k => { const s = this.prog[k] && this.prog[k].s; if(s === "weak") weak++; else if(s === "learning") learn++; else if(s && s !== "new") known++; }); return {known, weak, learn}; },
  mean(w){ return String(w.ja).split(/[；;]/)[0].replace(/[（(][^）)]*[)）]/g, "").trim() || w.ja; },
  item(w){
    const same = this.words.filter(x => x.no !== w.no && x.pos === w.pos);
    const all = shuffle([w].concat(shuffle(same.length >= 3 ? same : this.words.filter(x => x.no !== w.no)).slice(0, 3)));
    return {id:"t" + w.no, area:"t1900", jaChoices:true, choices:all.map(x => this.mean(x)), ans:all.indexOf(w), speak:w.en, short:w.en,
      prompt:'<p class="small">ターゲット1900　No.' + w.no + "　意味は？</p>" + '<p class="en q" style="font-family:var(--f-en);font-size:1.6rem">' + esc(w.en) + "</p>",
      explain:"<p><b class=\"en\">" + esc(w.en) + "</b>＝" + esc(w.ja) + "</p>" + (w.ex_en ? '<p class="en">' + esc(w.ex_en) + "</p><p>" + esc(w.ex_ja || "") + "</p>" : "")};
  },
  // 苦手 → 学習中 → チェック表で終わった範囲 → 覚えた語の復習 の順に出す
  items(n){
    const st = w => this.prog[w.no] && this.prog[w.no].s;
    let list = shuffle(this.words.filter(w => st(w) === "weak")).concat(shuffle(this.words.filter(w => st(w) === "learning")));
    const done = (S.target || []).map((v, k) => v ? k : -1).filter(k => k >= 0);
    if(list.length < n) list = list.concat(shuffle(this.words.filter(w => !st(w) && done.indexOf(Math.floor((w.no - 1) / 100)) >= 0)));
    if(list.length < n) list = list.concat(shuffle(this.words.filter(w => st(w) && ["weak","learning","new"].indexOf(st(w)) < 0)));
    if(list.length < n) list = list.concat(shuffle(this.words.slice(0, 800)));
    return list.slice(0, n).map(w => this.item(w));
  },
  byId(id){ const m = String(id).match(/^t(\d+)$/); if(!m || !this.ready) return null; const w = this.words.find(x => x.no === +m[1]); return w ? this.item(w) : null; }
};
function t19Card(){
  const st = T19.stat();
  if(T19.ready) return '<section class="card" id="t19card"><h3>⛏️ ターゲット1900 連動中</h3><p class="small">WORDCRAFT の記録：覚えた ' + st.known + "語・学習中 " + st.learn + "語・苦手 " + st.weak + "語（" + T19.words.length + "語を読み込み）。バトルにも苦手な語が出ます。</p>" +
    '<div class="row"><button class="btn primary" data-act="t19battle">苦手な語でラウンド戦</button><a class="btn" href="' + WORDCRAFT + '" target="_blank" rel="noopener">WORDCRAFT</a></div></section>';
  return '<section class="card" id="t19card"><h3>⛏️ ターゲット1900 連動</h3><p class="small">' +
    (T19.state === "off" ? "このアプリを WORDCRAFT と同じ GitHub Pages（genmaojun.github.io）に置くと、WORDCRAFT で覚えた語・苦手な語がバトルに出ます（いまは未連動）。" : T19.state === "loading" ? "WORDCRAFT の単語を読み込み中…" : "WORDCRAFT の単語を読み込めませんでした。") +
    '</p><div class="row"><a class="btn" href="' + WORDCRAFT + '" target="_blank" rel="noopener">WORDCRAFT を開く</a></div></section>';
}

function battlePool(){
  const v = shuffle(VOCAB.map((x, i) => i)).slice(0, 10).map(vocabItem);
  const id = shuffle(IDIOMS.map((x, i) => i)).slice(0, 10).map(i => Math.random() < 0.5 ? idiomBlankItem(i) : idiomMeanItem(i));
  const co = shuffle(COLLOC.map((x, i) => i)).slice(0, 8).map(collocItem);
  return shuffle(v.concat(id, co, T19.ready ? T19.items(14) : []));
}
function runBattle(opt){
  opt = opt || {};
  const g = G(); let alive = 100, hp = 100, sh = 50, elim = 0, streak = 0, qn = 0, okN = 0, over = false;
  const make = opt.pool || battlePool; let pool = make(); const xp0 = S.xp;
  const limit = () => Math.max(8, 20 - qn);
  function hud(){
    return '<div class="bhud"><span>👤 残り <b id="alive">' + alive + '</b></span><span>💥 <b id="elim">' + elim + "</b></span></div>" +
      '<div class="gbars"><div class="gbar sh"><i id="shb" style="width:' + (sh / 50 * 100) + '%"></i><span id="shl">🛡️ ' + sh + '</span></div><div class="gbar hp"><i id="hpb" style="width:' + hp + '%"></i><span id="hpl">❤️ ' + hp + "</span></div></div>" +
      '<div class="storm"><i id="stormBar"></i></div><p class="small" id="stormL"></p>';
  }
  function next(){
    if(over) return;
    if(!pool.length) pool = make();
    const it = pool.shift(); qn++;
    let left = limit(), answered = false; const total = left;
    view('<div class="bar"><button class="back" data-act="quit">← 抜ける</button><span class="prog">' + esc(opt.title || "バトル") + " · Q" + qn + "</span></div>" + hud() +
      '<div class="prompt">' + it.prompt + "</div>" +
      '<div class="choices" role="group" aria-label="選択肢">' + it.choices.map((c, k) => '<button class="choice" data-act="pick" data-k="' + k + '"><span class="bubble">' + (k + 1) + '</span><span class="ct' + (it.jaChoices ? "" : " en") + '">' + esc(c) + "</span></button>").join("") + "</div>" +
      '<div id="bfb" aria-live="polite"></div>', {
      quit: () => { over = true; finish(true); },
      pick: el => { if(answered) return; answered = true; resolve(+el.dataset.k === it.ans, el, false); }
    });
    const upd = () => { const b = $("#stormBar"), l = $("#stormL"); if(b) b.style.width = (left / total * 100) + "%"; if(l) l.textContent = "⛈️ 雷雲まで " + left + " 秒（問題ごとに短くなる）"; };
    upd();
    every(() => { if(answered) return; left--; upd(); if(left <= 0){ answered = true; resolve(false, null, true); } }, 1000);
    function resolve(ok, el, timeout){
      timers.forEach(clearInterval); timers = [];
      $$(".choice").forEach((b, k) => { b.disabled = true; if(k === it.ans) b.classList.add("right"); else if(b === el) b.classList.add("wrong"); });
      record(it.area, it.id, ok, ok ? 5 : 1);
      let msg;
      if(ok){ okN++; streak++; const k = Math.max(1, Math.min(alive - 1, 3 + Math.min(streak, 6) + Math.floor(Math.random() * 4))); alive -= k; elim += k; msg = "💥 " + k + "人撃破！" + (streak >= 3 ? "　🔥" + streak + "連続正解" : ""); sfxPoint(); burst(); }
      else { let dmg = 35; const s = Math.min(sh, dmg); sh -= s; dmg -= s; hp = Math.max(0, hp - dmg); streak = 0; msg = (timeout ? "⛈️ 雷雲に巻き込まれた！" : "💢 被弾！") + "　正解は " + (it.ans + 1) + "：" + esc(it.choices[it.ans]); sfxMiss(); }
      if(alive > 2) alive -= Math.min(alive - 2, Math.floor(Math.random() * 3));
      const set = (id, v) => { const e = $("#" + id); if(e) e.textContent = v; };
      set("alive", alive); set("elim", elim); set("shl", "🛡️ " + sh); set("hpl", "❤️ " + hp);
      const sb = $("#shb"), hb = $("#hpb"); if(sb) sb.style.width = (sh / 50 * 100) + "%"; if(hb) hb.style.width = hp + "%";
      const fb = $("#bfb"); if(fb){ fb.className = "bfb " + (ok ? "ok" : "ng"); fb.innerHTML = "<p>" + msg + "</p>"; }
      const stillHere = () => !!document.getElementById("bfb");
      if(alive <= 1 || hp <= 0){ over = true; setTimeout(() => { if(stillHere()) finish(false); }, ok ? 900 : 1700); }
      else setTimeout(() => { if(stillHere()) next(); }, ok ? 800 : 1900);
    }
  }
  function finish(quit){
    const win = !quit && hp > 0 && alive <= 1, place = win ? 1 : alive;
    const bonus = quit ? 0 : Math.round((100 - place) / 3) + (win ? 50 : 0);
    if(bonus) addXP(bonus);
    g.battles++; if(win) g.wins++; if(!quit && (!g.best || place < g.best)) g.best = place;
    if(!quit) gameEvent("battle", {place, win});
    if(elim) gameEvent("elim", elim);
    save(); topbar();
    if(win){ sfxLevelUp(); burst(40); }
    view('<div class="vict' + (win ? " win" : "") + '"><p class="place">' + (quit ? "途中で抜けた" : win ? "🏆 1位！" : "#" + place) + '</p><p class="small">' + (win ? "100人の中で最後の1人まで勝ち残った" : quit ? "記録した答えは残っています" : "100人中 " + place + "位") + "</p></div>" +
      '<section class="card"><div class="stats3"><div><b>' + okN + "/" + qn + "</b><small>正解</small></div><div><b>" + elim + "</b><small>撃破</small></div><div><b>+" + (S.xp - xp0) + "</b><small>XP・🪙</small></div></div></section>" +
      '<div class="row"><button class="btn primary wide" data-act="again">もう一度</button></div><div class="row"><button class="btn wide" data-act="lobby">ロビーへ</button></div>',
      {again: () => runBattle(opt), lobby: () => goTab("home")});
  }
  // 降下（地図で選んだ場所に降りてから1問目）
  let landed = false;
  const land = () => { if(landed) return; landed = true; next(); };
  view('<div class="drop"><p class="dropic" aria-hidden="true">🪂</p><p class="dropt">' + esc(opt.zone || "ランダムな場所") + " に降下中…</p>" +
    '<p class="small">着地したら1問目。雷雲が来る前に答えよう</p><button class="btn" data-act="land">すぐ着地</button></div>', {land:land});
  setTimeout(() => { if(document.querySelector(".drop")) land(); }, 1600);
}

/* ===== ラウンド戦（5対5・攻撃と防衛を交代する戦術型。どのゲームの名前・キャラクター・地図・絵・字体も写さず、このアプリ用に作った） ===== */
// 購入フェーズ → ラウンド（正解で相手を1人倒す・まちがい/時間切れで味方が1人倒れる・全滅させた側が勝ち）→ 先に4ラウンドで勝ち。3ラウンド後に攻守交代
const RM = {WIN:4, HALF:3, TEAM:5, LIMIT:15, HS:5};
const GEAR = [
  {id:"armor", ic:"🛡️", nm:"アーマー", cost:200, d:"まちがい1回を防ぐ（使わなければ次のラウンドへ持ち越し）"},
  {id:"intel", ic:"🔍", nm:"偵察", cost:250, d:"このラウンドは毎問、まちがいの選択肢を1つ消す"},
  {id:"focus", ic:"⏱️", nm:"集中", cost:100, d:"このラウンドは制限時間 +5秒"}
];
// 仲間（このアプリ用に作ったキャラ。スキルはラウンドに1回・必殺技は正解6回でたまる）
const AGENTS = [
  {id:"hayate", ic:"🌪️", nm:"ハヤテ", role:"突撃", sk:"連撃", skd:"次の正解で相手を2人倒す", ul:"暴風", uld:"次の正解で相手を3人倒す"},
  {id:"miyabi", ic:"🦉", nm:"ミヤビ", role:"偵察", sk:"見通し", skd:"今の問題のまちがいを2つ消す", ul:"千里眼", uld:"このラウンドの間、毎問まちがいを2つ消す"},
  {id:"tsumugi", ic:"🌿", nm:"ツムギ", role:"支援", sk:"立て直し", skd:"倒れた味方を1人戻す", ul:"再起", uld:"倒れた味方を全員戻す"},
  {id:"iwao", ic:"🧱", nm:"イワオ", role:"守備", sk:"鉄壁", skd:"次のまちがいを1回防ぐ", ul:"城壁", uld:"このラウンドの間、まちがいで味方が倒れない"}
];
const ULT_N = 6;
function runMatch(opt){
  opt = opt || {};
  const g = G(), make = opt.pool || battlePool, xp0 = S.xp;
  let pool = make(), us = 0, them = 0, round = 0, money = 800, armor = 0, kills = 0, deaths = 0, hs = 0, qn = 0, okN = 0, over = false;
  let buy = {}, agent = AGENTS.find(a => a.id === g.agent) || AGENTS[0], ult = 0;
  function pickAgent(){
    view('<div class="bar"><button class="back" data-act="quit">← 抜ける</button><span class="prog">' + esc(opt.title || "ラウンド戦") + '</span></div><h2 class="qt">仲間を選ぶ</h2>' +
      '<p class="small">スキルはラウンドに1回。必殺技は正解 ' + ULT_N + ' 回でたまり、ラウンドをまたいで持ち越せます。</p><div class="agents">' +
      AGENTS.map(a => '<button class="agent' + (a.id === agent.id ? " on" : "") + '" data-act="ag" data-id="' + a.id + '" aria-pressed="' + (a.id === agent.id) + '"><span class="aic">' + a.ic + '</span><b>' + a.nm + '</b><span class="arole">' + a.role + '</span><small>⚡ ' + a.sk + "：" + a.skd + "</small><small>★ " + a.ul + "：" + a.uld + "</small></button>").join("") +
      '</div><button class="playbtn match" data-act="lock"><span>この仲間で出る</span><small id="agSel">' + agent.ic + " " + agent.nm + "（" + agent.role + "）</small></button>", {
      quit: () => { over = true; finish(true); },
      ag: el => { agent = AGENTS.find(a => a.id === el.dataset.id) || agent; $$(".agent").forEach(b => { const on = b.dataset.id === agent.id; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); $("#agSel").textContent = agent.ic + " " + agent.nm + "（" + agent.role + "）"; sfxPoint(); },
      lock: () => { g.agent = agent.id; save(); buyPhase(); }
    });
  }
  const side = () => (round <= RM.HALF ? (opt.defFirst ? "防衛" : "攻撃") : (opt.defFirst ? "攻撃" : "防衛"));
  const sideText = s => s === "攻撃" ? "攻撃：相手の拠点を取りに行く" : "防衛：自分の拠点を守り切る";
  const score = () => '<div class="rscore" aria-label="スコア"><span class="us">味方 <b>' + us + '</b></span><span class="vs">ラウンド ' + Math.max(round, 1) + '</span><span class="them"><b>' + them + "</b> 相手</span></div>";
  const quitH = () => { over = true; finish(true); };
  function buyPhase(){
    if(over) return;
    round++; buy = {};
    if(round === RM.HALF + 1) notify("🔄 攻守交代！ ここから" + side() + "側");
    const draw = () => view('<div class="bar"><button class="back" data-act="quit">← 抜ける</button><span class="prog">' + esc(opt.title || "ラウンド戦") + "</span></div>" + score() +
      '<p class="rside ' + (side() === "攻撃" ? "atk" : "def") + '">' + sideText(side()) + "</p>" +
      '<section class="card buy"><h3>💰 購入フェーズ　<span class="money">資金 ' + money + "</span></h3>" +
      GEAR.map(x => { const own = x.id === "armor" && armor; const on = buy[x.id] || own;
        return '<button class="gear' + (on ? " on" : "") + '" data-act="gear" data-id="' + x.id + '"' + (own ? " disabled" : "") + '><span class="gic">' + x.ic + '</span><span class="gt"><b>' + x.nm + "</b><small>" + x.d + '</small></span><span class="gc">' + (own ? "持っている" : on ? "✓ 買った" : x.cost) + "</span></button>"; }).join("") +
      '<p class="small">ラウンドに勝つと +300・負けても +200。自分で倒すと +50、5秒以内に正解（ヘッドショット）でさらに +30。</p></section>' +
      '<button class="playbtn match" data-act="go"><span>▶ ラウンド開始</span><small>相手5人を全員倒せば勝ち</small></button>', {
      quit: quitH,
      gear: el => { const x = GEAR.find(y => y.id === el.dataset.id); if(!x || (x.id === "armor" && armor)) return;
        if(buy[x.id]){ delete buy[x.id]; money += x.cost; } else if(money >= x.cost){ buy[x.id] = 1; money -= x.cost; sfxPoint(); } else { notify("資金があと " + (x.cost - money) + " 足りません"); sfxMiss(); return; }
        draw(); },
      go: () => { if(buy.armor) armor = 1; playRound(); }
    });
    draw();
  }
  function playRound(){
    let foe = RM.TEAM, team = RM.TEAM, skillUsed = false, dbl = 0, block = 0, noDeath = false, see2 = false;
    const limit = RM.LIMIT + (buy.focus ? 5 : 0);
    const dots = n => Array.from({length:RM.TEAM}, (x, k) => '<i class="p' + (k < n ? "" : " down") + '"></i>').join("");
    const status = () => [dbl ? "⚡ 次の正解で" + dbl + "人" : "", block ? "🧱 鉄壁 " + block : "", noDeath ? "🧱 城壁" : "", see2 ? "🦉 千里眼" : "", armor ? "🛡️ アーマー" : ""].filter(Boolean).join("　");
    // まちがいの選択肢を n 個消す（もう消えている物と正解は除く）
    const hideWrong = (it, n) => { const c = $$(".choice").filter((b, k) => k !== it.ans && !b.classList.contains("gone")); shuffle(c).slice(0, n).forEach(b => { b.classList.add("gone"); b.disabled = true; b.setAttribute("aria-hidden", "true"); }); };
    function q(){
      if(over) return;
      if(!pool.length) pool = make();
      const it = pool.shift(); qn++;
      const t0 = Date.now(); let left = limit, answered = false;
      view('<div class="bar"><button class="back" data-act="quit">← 抜ける</button><span class="prog">' + agent.ic + " " + agent.nm + "・ラウンド " + round + " · " + side() + "</span></div>" + score() +
        '<div class="squads"><div class="sq us" id="sqUs" aria-label="味方 残り' + team + '人">' + dots(team) + '</div><div class="sq them" aria-label="相手 残り' + foe + '人">' + dots(foe) + "</div></div>" +
        '<div class="storm"><i id="rmBar"></i></div><p class="small" id="rmL"></p>' +
        '<div class="prompt">' + it.prompt + "</div>" +
        '<div class="choices" role="group" aria-label="選択肢">' + it.choices.map((c, k) => '<button class="choice" data-act="pick" data-k="' + k + '"><span class="bubble">' + (k + 1) + '</span><span class="ct' + (it.jaChoices ? "" : " en") + '">' + esc(c) + "</span></button>").join("") + "</div>" +
        '<div class="abil"><button class="ab" data-act="skill"' + (skillUsed ? " disabled" : "") + '><b>⚡ ' + agent.sk + "</b><small>" + agent.skd + '</small></button><button class="ab ult" data-act="ult"' + (ult < ULT_N ? " disabled" : "") + '><b>★ ' + agent.ul + " " + Math.min(ult, ULT_N) + "/" + ULT_N + "</b><small>" + agent.uld + "</small></button></div>" +
        '<p class="small" id="abSt">' + status() + "</p>" +
        '<div id="bfb" aria-live="polite"></div>', {
        quit: quitH,
        pick: el => { if(answered) return; answered = true; resolve(+el.dataset.k === it.ans, el, false); },
        skill: el => { if(skillUsed || answered) return; skillUsed = true; el.disabled = true; use(false); },
        ult: el => { if(ult < ULT_N || answered) return; ult = 0; el.disabled = true; const b = el.querySelector("b"); if(b) b.textContent = "★ " + agent.ul + " 0/" + ULT_N; use(true); }
      });
      if(see2) hideWrong(it, 2); else if(buy.intel) hideWrong(it, 1);
      function use(isUlt){
        const id = agent.id;
        if(id === "hayate") dbl = isUlt ? 3 : 2;
        else if(id === "miyabi"){ hideWrong(it, 2); if(isUlt) see2 = true; }
        else if(id === "tsumugi"){ team = isUlt ? RM.TEAM : Math.min(RM.TEAM, team + 1); const s = $("#sqUs"); if(s) s.innerHTML = dots(team); }
        else if(id === "iwao"){ if(isUlt) noDeath = true; else block++; }
        const st = $("#abSt"); if(st) st.textContent = status();
        notify((isUlt ? "★ " + agent.ul : "⚡ " + agent.sk) + "！ " + (isUlt ? agent.uld : agent.skd));
        if(isUlt){ sfxLevelUp(); burst(18); } else sfxWhistle();
      }
      const upd = () => { const b = $("#rmBar"), l = $("#rmL"); if(b) b.style.width = (left / limit * 100) + "%"; if(l) l.textContent = "⏱️ 残り " + left + " 秒（" + RM.HS + "秒以内の正解はヘッドショット）"; };
      upd();
      every(() => { if(answered) return; left--; upd(); if(left <= 0){ answered = true; resolve(false, null, true); } }, 1000);
      function resolve(ok, el, timeout){
        timers.forEach(clearInterval); timers = [];
        $$(".choice").forEach((b, k) => { b.disabled = true; if(k === it.ans) b.classList.add("right"); else if(b === el) b.classList.add("wrong"); });
        record(it.area, it.id, ok, ok ? 5 : 1);
        let msg;
        const right = "　正解は " + (it.ans + 1) + "：" + esc(it.choices[it.ans]);
        if(ok){
          const n = Math.min(foe, dbl || 1); dbl = 0;
          okN++; kills += n; foe -= n; money += 50 * n; ult = Math.min(ULT_N, ult + 1); const fast = (Date.now() - t0) / 1000 <= RM.HS;
          if(fast){ hs++; money += 30; }
          msg = (fast ? "🎯 ヘッドショット！" : "💥 ") + n + "人倒した！" + (ult >= ULT_N ? "　★必殺技が使える" : "");
          if(foe > 0 && Math.random() < 0.3){ foe--; msg += "　味方も1人倒した"; }
          sfxPoint(); burst(fast ? 22 : 12);
        } else if(noDeath){ msg = "🧱 城壁で防いだ！" + right; sfxMiss(); }
        else if(block){ block--; msg = "🧱 鉄壁で防いだ！" + right; sfxMiss(); }
        else if(armor){ armor = 0; msg = "🛡️ アーマーで防いだ！" + right; sfxMiss(); }
        else { team--; deaths++; msg = (timeout ? "⏱️ 時間切れ！味方が1人倒れた" : "💢 味方が1人倒れた") + right; sfxMiss(); }
        const fb = $("#bfb"); if(fb){ fb.className = "bfb " + (ok ? "ok" : "ng"); fb.innerHTML = "<p>" + msg + "</p>"; }
        const here = () => !!document.getElementById("bfb");
        if(foe <= 0 || team <= 0) setTimeout(() => { if(here()) endRound(foe <= 0); }, ok ? 900 : 1700);
        else setTimeout(() => { if(here()) q(); }, ok ? 800 : 1900);
      }
    }
    q();
  }
  function endRound(won){
    if(won){ us++; money += 300; } else { them++; money += 200; }
    const s = side();
    const why = won ? (s === "攻撃" ? "拠点を取った" : "拠点を守り切った") : (s === "攻撃" ? "攻めきれなかった" : "拠点を取られた");
    if(won) sfxCheer(); else sfxMiss();
    if(us >= RM.WIN || them >= RM.WIN) return finish(false);
    view('<div class="bar"><button class="back" data-act="quit">← 抜ける</button></div><div class="rend ' + (won ? "win" : "lose") + '"><p class="rt">' + (won ? "ラウンド勝利" : "ラウンド敗北") + '</p><p>' + why + "</p></div>" + score() +
      '<p class="small">資金 ' + money + (round === RM.HALF ? "。次のラウンドから攻守交代" : "") + (us === RM.WIN - 1 && them === RM.WIN - 1 ? "。次で決まる！" : "") + "</p>" +
      '<div class="row"><button class="btn primary wide" data-act="next">次のラウンドへ</button></div>', {next: buyPhase, quit: quitH});
  }
  function finish(quit){
    over = true;
    const win = !quit && us >= RM.WIN;
    const bonus = quit ? 0 : (win ? 60 : 20) + us * 5;
    if(bonus) addXP(bonus);
    g.mp = (g.mp || 0) + (quit ? 0 : 1); if(win) g.mw = (g.mw || 0) + 1;
    if(!quit) gameEvent("match", {win});
    save(); topbar();
    if(win){ sfxLevelUp(); burst(40); }
    view('<div class="vict' + (win ? " win match" : "") + '"><p class="place">' + (quit ? "途中で抜けた" : win ? "勝利" : "敗北") + '</p><p class="small">' + (quit ? "答えた記録は残っています" : "味方 " + us + " − " + them + " 相手") + "</p></div>" +
      '<section class="card"><div class="stats3"><div><b>' + kills + "/" + deaths + "</b><small>倒した/倒れた</small></div><div><b>" + (kills ? Math.round(hs / kills * 100) : 0) + "%</b><small>ヘッドショット</small></div><div><b>+" + (S.xp - xp0) + "</b><small>XP・🪙</small></div></div>" +
      '<p class="small" style="text-align:center">' + okN + " / " + qn + " 問正解</p></section>" +
      '<div class="row"><button class="btn primary wide" data-act="again">もう1試合</button></div><div class="row"><button class="btn wide" data-act="lobby">ロビーへ</button></div>',
      {again: () => runMatch(opt), lobby: () => goTab("home")});
  }
  pickAgent();
}

topbar();
route();
// iPhone は最初に触れた時に音と声の準備をしておく（WORDCRAFT と同じ）
window.addEventListener("touchend", () => { try { AC(); } catch(e){} if(TTS.ok){ try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch(e){} } }, {once:true});
// claude.ai の中で開いた時だけ、AI の添削ボタンを出す（使えない所では何も出さない）
(async () => {
  try {
    if(window.claude && typeof window.claude.use === "function"){
      const s = await window.claude.use("sample");
      if(s){ sampleFn = s; const box = $("#aiBox"); if(box && !box.innerHTML) box.innerHTML = '<button class="btn wide" data-act="ai">AI に添削してもらう（目安）</button>'; }
    }
  } catch(e){}
})();
})();
</script>
